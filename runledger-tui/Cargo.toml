[package]
name = "runledger-tui"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Read-only terminal UI for monitoring Runledger jobs and workflows"
readme = "../README.md"
repository = "https://github.com/featherenvy/runledger"
homepage = "https://github.com/featherenvy/runledger"
keywords = ["jobs", "workflows", "postgres", "tui"]
categories = ["command-line-utilities", "asynchronous"]

[[bin]]
name = "runledger-tui"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_28"] }
runledger-core = { workspace = true }
runledger-postgres = { workspace = true }
serde_json = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
