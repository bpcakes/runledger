[package]
name = "runledger-core"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Core contracts and types for the Runledger durable job and workflow system"
readme = "../README.md"
repository = "https://github.com/featherenvy/runledger"
homepage = "https://github.com/featherenvy/runledger"
documentation = "https://docs.rs/runledger-core"
exclude = ["AGENTS.md"]
keywords = ["jobs", "workflows", "postgres", "queue"]
categories = ["asynchronous", "database"]

[features]
sqlx-postgres = ["dep:sqlx"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", optional = true, default-features = false, features = ["postgres"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
proptest = "1.11"
