[package]
name = "runledger-core"
version = "0.1.0"
edition = "2024"

[features]
sqlx-postgres = ["dep:sqlx"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", optional = true, default-features = false, features = ["postgres"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
proptest = "1.11"
