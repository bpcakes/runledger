[workspace]
resolver = "2"

members = [
    "runledger-admin",
    "runledger-core",
    "runledger-postgres",
    "runledger-runtime",
    "runledger-test-support",
    "runledger-tui",
]

exclude = [
    "smoke/external-consumer",
]

default-members = [
    "runledger-admin",
    "runledger-core",
    "runledger-postgres",
    "runledger-runtime",
]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
future_not_send = "deny"
large_futures = "deny"
large_stack_frames = "deny"

[workspace.dependencies]
runledger-admin = { version = "0.10.1", path = "runledger-admin" }
runledger-core = { version = "0.10.1", path = "runledger-core" }
runledger-postgres = { version = "0.10.1", path = "runledger-postgres" }
runledger-runtime = { version = "0.10.1", path = "runledger-runtime" }
runledger-test-support = { version = "0.10.1", path = "runledger-test-support" }
cron = "0.16"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1", features = ["std"] }
