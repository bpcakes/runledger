[package]
name = "runledger-admin"
version = "0.10.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Read-only HTTP admin API for Runledger jobs and workflows"
readme = "../README.md"
repository = "https://github.com/bpcakes/runledger"
homepage = "https://github.com/bpcakes/runledger"
documentation = "https://docs.rs/runledger-admin"
keywords = ["jobs", "workflows", "admin", "axum"]
categories = ["asynchronous", "web-programming::http-server"]

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
runledger-core = { workspace = true }
runledger-postgres = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
tracing = "0.1"
utoipa = { version = "5.5", default-features = false, features = ["chrono", "macros", "uuid"] }

[dev-dependencies]
runledger-test-support = { workspace = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid"] }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
