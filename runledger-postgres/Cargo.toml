[package]
publish = false
name = "runledger-postgres"
version.workspace = true
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "PostgreSQL persistence layer for the Runledger durable job and workflow system"
readme = "../README.md"
repository = "https://github.com/bpcakes/runledger"
homepage = "https://github.com/bpcakes/runledger"
documentation = "https://docs.rs/runledger-postgres"
exclude = ["AGENTS.md"]
keywords = ["jobs", "workflows", "postgres", "queue"]
categories = ["asynchronous", "database"]

[lints]
workspace = true

[features]
test-support = []

[dependencies]
batter-sqlx = { version = "0.1.0", path = "../../batter/crates/batter-sqlx" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cron = { workspace = true }
runledger-core = { workspace = true, features = ["sqlx-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"] }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
static_assertions = "1.1.0"
runledger-test-support = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }
