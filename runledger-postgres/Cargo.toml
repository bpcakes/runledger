[package]
name = "runledger-postgres"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "PostgreSQL persistence layer for the Runledger durable job and workflow system"
readme = "../README.md"
repository = "https://github.com/bpcakes/runledger"
homepage = "https://github.com/bpcakes/runledger"
documentation = "https://docs.rs/runledger-postgres"
exclude = ["AGENTS.md"]
keywords = ["jobs", "workflows", "postgres", "queue"]
categories = ["asynchronous", "database"]

[features]
test-support = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cron = { workspace = true }
runledger-core = { workspace = true, features = ["sqlx-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"] }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
runledger-test-support = { workspace = true }
testcontainers = { version = "0.27", features = ["watchdog"] }
tokio = { workspace = true }
