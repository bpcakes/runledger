name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.19.7"
  SQLX_OFFLINE: "true"
  RUNLEDGER_TEST_PG_IMAGE: postgres:18

jobs:
  lint:
    name: Lint and compile
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal --component rustfmt --component clippy
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: ./scripts/lint.sh
      - run: ./scripts/check-package-licenses.sh
      - run: cargo check --workspace
      - run: cargo test --workspace --no-run

  test:
    name: Test and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal --component rustfmt --component clippy
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Wait for Docker
        run: |
          for attempt in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Docker did not become ready in time" >&2
          exit 1
      - name: Test runledger-core
        run: cargo test -p runledger-core
      - name: Test runledger-postgres
        run: cargo test -p runledger-postgres
      - name: Test runledger-runtime
        run: cargo test -p runledger-runtime
      - name: Test runledger-test-support library
        run: cargo test -p runledger-test-support --lib
      - name: Test container cleanup after normal exit
        run: >-
          timeout --signal=TERM --kill-after=30s 3m
          cargo test -p runledger-test-support --test container_lifecycle --
          --exact shared_container_is_removed_after_normal_process_exit
          --nocapture --test-threads=1
      - name: Test container cleanup after forced termination
        run: >-
          timeout --signal=TERM --kill-after=30s 3m
          cargo test -p runledger-test-support --test container_lifecycle --
          --exact shared_container_is_removed_after_forced_process_termination
          --nocapture --test-threads=1
      - name: Test container startup without reaper CLI
        run: >-
          timeout --signal=TERM --kill-after=30s 3m
          cargo test -p runledger-test-support --test container_lifecycle --
          --exact shared_container_starts_without_a_docker_cli_for_the_optional_reaper
          --nocapture --test-threads=1
      - name: Test container startup with stalled reaper CLI
        run: >-
          timeout --signal=TERM --kill-after=30s 3m
          cargo test -p runledger-test-support --test container_lifecycle --
          --exact shared_container_starts_when_optional_reaper_cli_hangs
          --nocapture --test-threads=1
      - name: Test runledger-tui
        run: cargo test -p runledger-tui
      - name: Run packaged-crate smoke test
        run: ./scripts/run-external-consumer-smoke.sh

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
      - run: cargo deny check

  semver:
    name: Semver compatibility
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # obi1kenobi/cargo-semver-checks-action v2
      - name: Check public APIs against 0.11.0
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239
        with:
          package: runledger-core,runledger-test-support,runledger-postgres,runledger-runtime
          baseline-version: 0.11.0
          # 0.12.0 deliberately adds an exhaustive public enum variant.
          release-type: major
