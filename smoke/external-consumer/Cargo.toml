[workspace]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
future_not_send = "deny"
large_futures = "deny"
large_stack_frames = "deny"

[package]
name = "runledger-external-consumer-smoke"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dev-dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Direct `cargo test --manifest-path smoke/external-consumer/Cargo.toml` uses
# local paths so contributors are not blocked before the next crates.io release.
# scripts/run-external-consumer-smoke.sh rewrites these to packaged version
# requirements, patches crates.io to extracted `.crate` archives, and requires
# this crate's checked-in lockfile to remain valid.
runledger-core = { path = "../../runledger-core" }
runledger-postgres = { path = "../../runledger-postgres" }
runledger-runtime = { path = "../../runledger-runtime" }
runledger-test-support = { path = "../../runledger-test-support" }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
testcontainers = { version = "0.28", features = ["watchdog"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
