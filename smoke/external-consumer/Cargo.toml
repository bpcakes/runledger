[workspace]

[package]
name = "runledger-external-consumer-smoke"
version = "0.1.0"
edition = "2024"
publish = false

[dev-dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Direct `cargo test --manifest-path smoke/external-consumer/Cargo.toml` uses
# local paths so contributors are not blocked before the next crates.io release.
# scripts/run-external-consumer-smoke.sh rewrites these to packaged version
# requirements and patches crates.io to extracted `.crate` archives.
runledger-core = { path = "../../runledger-core" }
runledger-postgres = { path = "../../runledger-postgres" }
runledger-runtime = { path = "../../runledger-runtime" }
runledger-test-support = { path = "../../runledger-test-support" }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
testcontainers = { version = "0.27", features = ["watchdog"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
