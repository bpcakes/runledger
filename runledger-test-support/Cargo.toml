[package]
name = "runledger-test-support"
version.workspace = true
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Test support utilities for Runledger PostgreSQL integration tests"
readme = "../README.md"
repository = "https://github.com/bpcakes/runledger"
homepage = "https://github.com/bpcakes/runledger"
documentation = "https://docs.rs/runledger-test-support"
exclude = ["AGENTS.md"]
keywords = ["jobs", "workflows", "postgres", "testing"]
categories = ["development-tools::testing", "database"]

[lints]
workspace = true

[dependencies]
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "migrate", "uuid"] }
testcontainers = { version = "0.28", features = ["watchdog"] }
tokio = { workspace = true }
